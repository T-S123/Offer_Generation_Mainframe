{
  "x-file-purpose": "Defines the marketing service API for training, personalized offers, comparison metrics and customer choices.",
  "openapi": "3.0.3",
  "info": {
    "title": "Independent Marketing Offer Creation Service",
    "version": "1.1.0",
    "description": "Local cohort training and qualified financial personalization. Acceptance metrics are utility simulations with no observed labels. Operator audit includes withdrawn offers; customer APIs recheck current eligibility. Terminal engine proxy prefix: /api/v1/offer-creation."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8092/api/v1"
    },
    {
      "url": "http://127.0.0.1:8090/api/v1/offer-creation"
    }
  ],
  "security": [
    {
      "serviceBearer": []
    }
  ],
  "paths": {
    "/customers/{customerId}/offers/{id}/selections": {
      "parameters": [
        {
          "name": "customerId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        },
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "post": {
        "operationId": "confirmPresentedOffer",
        "summary": "Confirm the exact reviewed terms for this customer and current qualification",
        "description": "Rechecks current consent, suppression, bureau and Step 2 qualification. Delivery channel and outbound execution throttles do not gate this selection. Request IDs are idempotent only for identical customer offer, version, kind and terms; current eligibility is rechecked on retry. This demo does not fund a loan.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PresentedSelection"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Selection and storage event committed, or identical request replayed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SelectionReceipt"
                }
              }
            }
          },
          "default": {
            "description": "401 unauthorized; 403 browser origin; 404 customer/offer mismatch; 409 changed qualification/terms or request conflict; 422 invalid fields; 503 authority unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
