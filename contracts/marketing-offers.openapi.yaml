  "components": {
    "securitySchemes": {
      "serviceBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Terms": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "amountUsd",
          "aprPct",
          "annualFeeUsd",
          "termMonths"
        ],
        "properties": {
          "amountUsd": {
            "type": "number",
            "exclusiveMinimum": true,
            "minimum": 0
          },
          "aprPct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "annualFeeUsd": {
            "type": "number",
            "minimum": 0
          },
          "termMonths": {
            "type": "integer",
            "minimum": 0,
            "maximum": 120
          }
        }
      },
      "Metrics": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "fitScore",
          "simulatedAcceptance",
          "monthlyPaymentUsd",
          "totalCostUsd",
          "affordability",
          "amountMatch",
          "costFit",
          "termFit"
        ],
        "properties": {
          "fitScore": {
            "type": "number"
          },
          "simulatedAcceptance": {
            "type": "number"
          },
          "monthlyPaymentUsd": {
            "type": "number"
          },
          "totalCostUsd": {
            "type": "number"
          },
          "affordability": {
            "type": "number"
          },
          "amountMatch": {
            "type": "number"
          },
          "costFit": {
            "type": "number"
          },
          "termFit": {
            "type": "number"
          }
        }
      },
      "Alternative": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kind",
          "terms",
          "metrics",
          "variantQualificationId",
          "validUntil"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "ORIGINAL",
              "PERSONALIZED"
            ]
          },
          "terms": {
            "$ref": "#/components/schemas/Terms"
          },
          "metrics": {
            "$ref": "#/components/schemas/Metrics"
          },
          "variantQualificationId": {
            "type": "string",
            "nullable": true
          },
          "validUntil": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Offer": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "sourceVersion",
          "customerId",
          "riskId",
          "campaignId",
          "catalogOfferId",
          "catalogOfferVersion",
          "product",
          "currency",
          "status",
          "personalizationStatus",
          "createdAt",
          "validUntil",
          "modelId",
          "policyVersion",
          "cohort",
          "original",
          "personalized",
          "deltas",
          "explanations"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "sourceVersion": {
            "type": "integer",
            "minimum": 1
          },
          "customerId": {
            "type": "string"
          },
          "riskId": {
            "type": "string"
          },
          "campaignId": {
            "type": "string"
          },
          "catalogOfferId": {
            "type": "string"
          },
          "catalogOfferVersion": {
            "type": "integer"
          },
          "product": {
            "type": "string",
            "enum": [
              "PERSONAL_LOAN",
              "CREDIT_CARD",
              "AUTO_LOAN"
            ]
          },
          "currency": {
            "type": "string",
            "enum": [
              "USD"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "REVOKED"
            ]
          },
          "personalizationStatus": {
            "type": "string"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "validUntil": {
            "type": "string",
            "format": "date-time"
          },
          "modelId": {
            "type": "string",
            "nullable": true
          },
          "policyVersion": {
            "type": "string"
          },
          "cohort": {
            "type": "integer"
          },
          "original": {
            "$ref": "#/components/schemas/Alternative"
          },
          "personalized": {
            "nullable": true,
            "allOf": [
              {
                "$ref": "#/components/schemas/Alternative"
              }
            ]
          },
          "deltas": {
            "type": "object",
            "additionalProperties": {
              "type": "number"
            }
          },
          "explanations": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Training": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "batchId",
          "seed"
        ],
        "properties": {
          "batchId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "seed": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "PresentedSelection": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "requestId",
          "sourceVersion",
          "kind",
          "terms"
        ],
        "properties": {
          "requestId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_.:-]{1,80}$"
          },
          "sourceVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "description": "Qualification response version, not storage revision"
          },
          "kind": {
            "type": "string",
            "enum": [
              "ORIGINAL",
              "PERSONALIZED"
            ]
          },
          "terms": {
            "$ref": "#/components/schemas/Terms"
          }
        }
      },
      "SelectionReceipt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "requestId",
          "offerId",
          "sourceVersion",
          "kind",
          "selectedAt",
          "status",
          "terms"
        ],
        "properties": {
          "requestId": {
            "type": "string"
          },
          "offerId": {
            "type": "string"
          },
          "sourceVersion": {
            "type": "integer",
            "format": "int64"
          },
          "kind": {
            "type": "string",
            "enum": [
              "ORIGINAL",
              "PERSONALIZED"
            ]
          },
          "selectedAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "SELECTED_DEMO_ONLY"
            ]
          },
          "terms": {
            "$ref": "#/components/schemas/Terms"
          }
        }
      },
      "Selection": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "requestId",
          "sourceVersion",
          "kind"
        ],
        "properties": {
          "requestId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_.:-]{1,80}$"
          },
          "sourceVersion": {
            "type": "integer",
            "minimum": 1
          },
          "kind": {
            "type": "string",
            "enum": [
              "ORIGINAL",
              "PERSONALIZED"
            ]
          }
        }
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string"
          }
        }
      },
      "Page": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextAfter"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Offer"
            }
          },
          "nextAfter": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "CustomerCandidate": {
        "type": "object",
        "required": [
          "requestId",
          "responseId",
          "responseVersion",
          "policyVersion",
          "terms",
          "profileVersion",
          "customerPolicyVersion",
          "ruleChanges"
        ],
        "additionalProperties": false,
        "properties": {
          "requestId": {
            "type": "string",
            "maxLength": 76
          },
          "responseId": {
            "type": "string"
          },
          "responseVersion": {
            "type": "integer"
          },
          "policyVersion": {
            "type": "string"
          },
          "terms": {
            "$ref": "./marketing-offers.openapi.yaml#/components/schemas/Terms"
          },
          "customerPolicyVersion": {
            "type": "string",
            "nullable": true
          },
          "ruleChanges": {
            "type": "array",
            "nullable": true,
            "maxItems": 2,
            "items": {
              "$ref": "./offer-source.openapi.yaml#/components/schemas/RuleChange"
            }
          },
          "profileVersion": {
            "type": "integer",
            "minimum": 1,
            "nullable": true
          }
        }
      },
      "CandidateEvaluation": {
        "type": "object",
        "properties": {
          "approval": {
            "$ref": "./offer-source.openapi.yaml#/components/schemas/Approval"
          },
          "metrics": {
            "$ref": "#/components/schemas/Metrics"
          },
          "baselineMetrics": {
            "$ref": "#/components/schemas/Metrics"
          },
          "metricId": {
            "type": "string"
          },
          "improvesFit": {
            "type": "boolean"
          },
          "scoringVersion": {
            "type": "string"
          },
          "acceptanceBasis": {
            "type": "string",
            "enum": [
              "NOT_A_POPULATION_FORECAST"
            ]
          }
        },
        "required": [
          "approval",
          "metrics",
          "baselineMetrics",
          "metricId",
          "improvesFit",
          "scoringVersion",
          "acceptanceBasis"
        ],
        "additionalProperties": false
      },
      "SessionQuote": {
        "type": "object",
        "required": [
          "id",
          "profileVersion",
          "offer",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "profileVersion": {
            "type": "integer"
          },
          "approvalId": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "SELECTED"
            ]
          },
          "offer": {
            "$ref": "#/components/schemas/Offer"
          },
          "selection": {
            "$ref": "#/components/schemas/SelectionReceipt"
          }
        }
      }
    }
  }
}
