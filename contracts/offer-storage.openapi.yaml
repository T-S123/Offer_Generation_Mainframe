{
  "x-file-purpose": "Defines repository, customer-copy and enterprise-copy HTTP views of stored offers and their history.",
  "openapi": "3.0.3",
  "info": {
    "title": "Step 6 Offer Storage and Enterprise Copies",
    "version": "1.0.0",
    "description": "Local operator credentials; no customer identity isolation. Customer/warehouse copies are eventual. Eligibility checked at customer read; selection uses existing Step 5 API. Direct marketing storage routes remove /offer-creation and use port 8092 and the marketing token."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8090/api/v1"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/offer-creation/storage/candidates": {
      "get": {
        "operationId": "currentCampaignCandidates",
        "summary": "Current qualified campaign families for Step 7; direct service path /storage/candidates on port 8092",
        "parameters": [
          {"name": "customerId", "in": "query", "required": true, "schema": {"type": "string"}},
          {"name": "campaignId", "in": "query", "required": true, "schema": {"type": "string"}}
        ],
        "responses": {"200": {"description": "All active qualified families, at most 1000; pending is true while personalization runs", "content": {"application/json": {"schema": {"type": "object", "properties": {"pending": {"type": "boolean"}, "items": {"type": "array", "items": {"type": "object", "properties": {"offer": {"type": "object", "description": "Current Step 5 OfferSet"}, "stored": {"$ref": "#/components/schemas/Snapshot"}}}}}}}}}, "default": {"description": "422 invalid IDs or candidate limit exceeded; 503 dependency unavailable"}}
      }
    },
    "/offer-creation/storage/offers": {
      "get": {
        "operationId": "storedOfferFamilies",
        "summary": "Admin current snapshots, including hidden pre-screen matches",
        "parameters": [
          {
            "name": "after",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Snapshot"
                      }
                    },
                    "nextAfter": {
                      "type": "string",
                      "nullable": true
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "401 unauthorized; 404 missing; 409 unavailable eligibility; 422 invalid input; 503 dependency unavailable"
          }
        }
      }
    },
    "/offer-creation/storage/offers/{id}": {
      "get": {
        "operationId": "storedOfferFamily",
        "summary": "Latest authoritative storage event; admin audit",
        "parameters": [
