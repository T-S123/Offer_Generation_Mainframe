          "termMonths"
        ],
        "properties": {
          "amountUsd": {
            "type": "number",
            "minimum": 0
          },
          "aprPct": {
            "type": "number",
            "minimum": 0
          },
          "annualFeeUsd": {
            "type": "number",
            "minimum": 0
          },
          "termMonths": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Metrics": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "fitScore",
          "simulatedAcceptance",
          "monthlyPaymentUsd",
          "totalCostUsd",
          "affordability",
          "amountMatch",
          "costFit",
          "termFit"
        ],
        "properties": {
          "fitScore": {
            "type": "number"
          },
          "simulatedAcceptance": {
            "type": "number"
          },
          "monthlyPaymentUsd": {
            "type": "number"
          },
          "totalCostUsd": {
            "type": "number"
          },
          "affordability": {
            "type": "number"
          },
          "amountMatch": {
            "type": "number"
          },
          "costFit": {
            "type": "number"
          },
          "termFit": {
            "type": "number"
          }
        }
      },
      "Item": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "category",
          "status",
          "visible",
          "terms",
          "metrics",
          "variantQualificationId",
          "validUntil"
        ],
        "properties": {
          "category": {
            "enum": [
              "PRE_SCREEN",
              "MARKETING"
            ]
          },
          "status": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_.:-]{1,160}$"
          },
          "visible": {
            "type": "boolean"
          },
          "terms": {
            "type": "object",
            "nullable": true,
            "allOf": [
              {
                "$ref": "#/components/schemas/Terms"
              }
            ]
          },
          "metrics": {
            "type": "object",
            "nullable": true,
            "allOf": [
              {
                "$ref": "#/components/schemas/Metrics"
              }
            ]
          },
          "variantQualificationId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_.:-]{1,160}$",
            "nullable": true
          },
          "validUntil": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        }
      },
      "Evidence": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "runId",
          "riskId",
          "qualificationId",
          "campaignId",
          "catalogOfferId",
          "bureauDecisionId",
          "underwritingDecisionId",
          "eligibilityPolicyVersion",
          "responseVersion",
          "campaignVersion",
          "catalogOfferVersion"
        ],
        "properties": {
          "runId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_.:-]{1,160}$",
